# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Library dependencies (pnpm workspace at the root)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '05:45'
      timezone: 'Etc/UTC'

    # Limit the number of open pull requests
    open-pull-requests-limit: 5

    # One PR per dependency type instead of one PR per package
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

    # Conventional commits: required by commitlint and release-please.
    # `chore` never triggers a release, which is what we want for deps.
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'

    labels:
      - 'dependencies'
      - 'automated'

    # Major bumps of the React peer dependency are a breaking change for
    # consumers of the library: they must be reviewed and released manually.
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is blocked by the plugin ecosystem, not by anything in
      # this repo — see the tracking issue. Only the major is held back, so
      # 5.x fixes still come through. Remove this entry when the block lifts;
      # the issue says what to watch for.
      #
      # The matching ESLint entries are gone: ESLint 10 was adopted by moving
      # off eslint-plugin-react (see #119), so there is nothing left to hold.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    allow:
      - dependency-type: 'direct'

    rebase-strategy: 'auto'

  # Documentation site (Astro, own yarn.lock)
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '05:45'
      timezone: 'Etc/UTC'

    open-pull-requests-limit: 3

    groups:
      docs-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

    commit-message:
      prefix: 'chore'
      include: 'scope'

    labels:
      - 'dependencies'
      - 'documentation'
      - 'automated'

    # Nothing is held back here. The Astro 2 pin that used to live in this block
    # is gone: the site now runs Astro 7, and the two packages that forced the
    # pin — @astrojs/mdx and @astrojs/prism — were removed outright, because the
    # site has no markdown pages for them to render. `shiki` went with them; the
    # `Code` component bundles its own highlighter.
    #
    # An Astro major still has to move as a unit (core plus every @astrojs/*
    # integration), so a lone major bump from Dependabot can legitimately fail
    # the build-docs job. Upgrade the set together rather than re-adding an
    # ignore rule — that is what left this site four years behind last time.

    allow:
      - dependency-type: 'direct'

    rebase-strategy: 'auto'

  # GitHub Actions used by the workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '05:45'
      timezone: 'Etc/UTC'

    groups:
      github-actions:
        patterns:
          - '*'

    commit-message:
      prefix: 'ci'
      include: 'scope'

    labels:
      - 'github-actions'
      - 'automated'
