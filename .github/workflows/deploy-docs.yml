name: Build and Deploy docs

on:
  # Deploy only for an actual release, so the published docs describe the
  # version available on npm. A `workflow_run` on the Release workflow would
  # not work: release-please runs on every push to main to refresh its release
  # PR, so it completes even when nothing is released. Use workflow_dispatch
  # for doc-only fixes that should not wait for the next release.
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy-docs:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # Node 22: astro 7 and the @astrojs/* integrations declare engines.node
      # ">=22.12.0" (recast 0.24 wants ">= 22"). Keep in sync with the
      # build-docs job in main.yml, which gates this workflow.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and Build 🔧
        run: |
          cd docs
          yarn install --frozen-lockfile
          yarn build

      - name: Deploy with gh-pages 🚀
        run: |
          cd docs
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          yarn deploy --user "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: New version notification
        uses: neolitec/notify-action@v1.0.1
        with:
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          title: '📖 Documentation for ${{ github.repository }} has been deployed'
          message: 'You can access it [here](https://neolitec.github.io/kevlar-tabs)'
