name: Test and Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # 22 is the floor for @eslint-react/eslint-plugin (engines >=22).
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          run_install: |
            - recursive: false
              args: [--frozen-lockfile, --prefer-offline]

      - run: pnpm lint
      - run: pnpm test -- --run
      - run: pnpm build

  # The docs site has its own dependency tree and was previously only built on
  # push to main, so a broken bump could not be caught before merging.
  # Node 22: astro 7 and the @astrojs/* integrations declare engines.node
  # ">=22.12.0" (recast 0.24 wants ">= 22").
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and Build 🔧
        run: |
          cd docs
          yarn install --frozen-lockfile
          yarn build
  